# Builds the HackathonBase Android app (mobile/) and publishes the APK on the
# "android-app" release, so organisers can share one download link.
name: Android app

on:
  workflow_dispatch:
  push:
    paths:
      - "mobile/**"
      - ".github/workflows/android-app.yml"

permissions:
  contents: write

concurrency:
  group: android-app-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mobile
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: mobile/package-lock.json

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Install and copy the app files into the Android project
        run: |
          npm ci
          npx cap sync android

      # Optional: a fixed signing key (repository secrets) lets each new APK
      # install over the old one. Without it the APK is signed with a
      # temporary key, so a phone must uninstall the old app before updating.
      - name: Signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/release.keystore" >> "$GITHUB_ENV"
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret: signing with a temporary key."
          fi

      - name: Build APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          APP_VERSION_CODE: ${{ github.run_number }}
          APP_VERSION_NAME: 1.0.${{ github.run_number }}
        run: |
          cd android
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease
          cp app/build/outputs/apk/release/app-release.apk "$GITHUB_WORKSPACE/HackathonBase.apk"

      - uses: actions/upload-artifact@v4
        with:
          name: HackathonBase-apk
          path: HackathonBase.apk

      - name: Publish on the android-app release
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: .
        run: |
          notes="HackathonBase app for food shops and attendance takers. Version 1.0.${{ github.run_number }} (built from ${GITHUB_SHA::7})."
          if gh release view android-app >/dev/null 2>&1; then
            gh release edit android-app --notes "$notes" --target "$GITHUB_SHA"
          else
            gh release create android-app --title "HackathonBase Android app" --notes "$notes" --target "$GITHUB_SHA" --latest=false
          fi
          gh release upload android-app HackathonBase.apk --clobber
