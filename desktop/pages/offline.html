<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; style-src 'unsafe-inline'; script-src 'unsafe-inline'">
  <title>No internet · HackGround OS</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: "Segoe UI", system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    .card { max-width: 380px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; padding: 28px; box-shadow: 0 10px 30px -8px rgb(15 23 42 / .18); }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #5b6678; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; color: #fff; background: #4f46e5; border: 0; border-radius: 8px; padding: 12px 22px; cursor: pointer; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Can't reach HackGround OS</h1>
    <p>Check the internet connection (Wi-Fi or cable), then try again.</p>
    <button type="button" id="retry">Try again</button>
  </div>
  <script>
    const target = new URLSearchParams(location.search).get("url");
    document.getElementById("retry").onclick = () => { if (target && target.startsWith("https://")) location.href = target; };
  </script>
</body>
</html>
