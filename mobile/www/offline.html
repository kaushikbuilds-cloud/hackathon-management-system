<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f1e8; color: #111; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    .card { max-width: 360px; border: 2px solid #111; border-radius: 12px; background: #fff; padding: 24px; box-shadow: 4px 4px 0 #111; }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #3f3f46; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; color: #fff; background: #2f3fe0; border: 2px solid #111; border-radius: 8px; padding: 12px 20px; box-shadow: 3px 3px 0 #111; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No internet connection</h1>
    <p>HackathonBase needs the internet to take orders and check people in. Turn on mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.href='https://hackathonbase.vercel.app/app'">Try again</button>
  </div>
</body>
</html>
