<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>No internet</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f8fafc; color: #0f172a; font-family: system-ui, sans-serif; padding: 16px; box-sizing: border-box; text-align: center; }
    .card { max-width: 360px; border: 1px solid #e2e8f0; border-radius: 12px; background: #fff; padding: 24px; box-shadow: 0 10px 30px -8px rgb(15 23 42 / .18); }
    h1 { font-size: 1.4rem; margin: 0 0 8px; }
    p { color: #5b6678; margin: 0 0 20px; }
    button { font: inherit; font-weight: 700; color: #fff; background: #4f46e5; border: 0; border-radius: 8px; padding: 12px 20px; }
  </style>
</head>
<body>
  <div class="card">
    <h1>No internet connection</h1>
    <p>HackGround OS needs the internet to take orders and check people in. Turn on mobile data or Wi-Fi, then try again.</p>
    <button type="button" onclick="location.href='https://hackgroundos.vercel.app/app'">Try again</button>
  </div>
  <script>window.Capacitor && Capacitor.Plugins && Capacitor.Plugins.SplashScreen && Capacitor.Plugins.SplashScreen.hide();</script>
</body>
</html>
