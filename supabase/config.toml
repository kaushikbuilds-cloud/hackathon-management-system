# Supabase CLI configuration for LOCAL development (`supabase start`).
# Production settings are configured in the Supabase dashboard (see README).
project_id = "hackathon-management-system"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[db.seed]
enabled = true
sql_paths = ["./seed.sql"]

[studio]
enabled = true
port = 54323

[inbucket]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = ["http://localhost:3000/auth/callback", "http://localhost:3000/auth/confirm"]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = false
minimum_password_length = 10

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = false

[auth.email.template.invite]
subject = "Activate your Hackathon Team Portal account"
content_path = "./supabase/templates/invite.html"

[auth.email.template.recovery]
subject = "Reset your Hackathon portal password"
content_path = "./supabase/templates/recovery.html"

[auth.rate_limit]
email_sent = 30
sign_in_sign_ups = 30
token_verifications = 30
